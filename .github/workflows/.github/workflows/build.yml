name: Build Android AAR

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: 3. 设置 Android NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '26.1.10909125'

      - name: 4. 强力注入依赖 (解决 bind 报错的关键)
        run: |
          go env -w GOPROXY=https://goproxy.cn,direct
          # 1. 强行把 mobile 包拉到本地缓存
          go get golang.org/x/mobile/bind@latest
          go mod download golang.org/x/mobile
          
          # 2. 安装并同步工具版本
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          
          # 3. 将工具路径加入系统
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          
          # 4. 强制整理一次依赖，确保零件都齐了
          go mod tidy

      - name: 5. 初始化工具链
        run: |
          # 必须用绝对路径初始化，确保环境干净
          $(go env GOPATH)/bin/gomobile init

      - name: 6. 正式打包 AAR (带调试参数)
        env:
          CGO_ENABLED: 1
        run: |
          # 我们不再 cd 进去，直接从根目录通过路径打包，防止上下文丢失
          # 加上 -x 可以看到它底层到底在找哪个路径
          gomobile bind -v -x -androidapi 21 -target=android ./experimental/libbox

      - name: 7. 上传成品
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: ./*.aar
